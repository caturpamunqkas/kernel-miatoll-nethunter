name: build-kernel

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # Runner ships ~14 GB free; kernel tree 1.4 GB + clang 1.7 GB + LTO output > 3 GB.
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev patch \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross zip unzip rsync cpio zstd lz4

      # Cache the PRISTINE tree and the toolchain, not the patched one: a cached
      # patched tree would make apply-patches.sh re-apply on top of itself.
      - name: Cache pristine kernel tree + clang
        uses: actions/cache@v4
        with:
          path: |
            src/kernel
            src/clang
          key: ksrc-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ksrc-

      - name: Restore tree to pristine
        run: |
          if [ -d src/kernel/.git ]; then
            git -C src/kernel checkout -- . || true
            git -C src/kernel clean -fdq || true
            rm -f src/kernel/.nethunter-patches-applied
          fi

      - name: Build kernel
        run: ./scripts/build.sh --jobs "$(nproc)"

      - name: Package AnyKernel3
        run: |
          curl -sL -o ak3.tar.gz https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.tar.gz
          tar xzf ak3.tar.gz
          cp configs/anykernel.sh AnyKernel3-master/anykernel.sh
          cp out/arch/arm64/boot/Image.gz AnyKernel3-master/
          cd AnyKernel3-master
          zip -r9 ../nethunter-miatoll-$(date +%Y%m%d)-${{ github.run_number }}.zip \
            anykernel.sh Image.gz META-INF tools patch

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-miatoll-kernel
          path: |
            nethunter-miatoll-*.zip
            out/arch/arm64/boot/Image.gz
            out/.config
          if-no-files-found: error
