name: build-kernel

on:
  workflow_dispatch:
    inputs:
      lite:
        description: "Drop LTO/CFI/DEBUG_INFO (use if the LTO link runs out of memory)"
        type: boolean
        default: false
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # Runner ships ~14 GB free; kernel tree 1.4 GB + clang 1.7 GB + LTO output > 3 GB.
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev patch \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross zip unzip rsync cpio zstd lz4

      # Fixed key, not per-run: the tree is reset to upstream below, so a cached
      # patched tree is harmless and the clone is skipped on every run.
      - name: Cache kernel tree + clang
        uses: actions/cache@v4
        with:
          path: |
            src/kernel
            src/clang
          key: ksrc-lineage-21-v1
          restore-keys: ksrc-lineage-21-

      # apply-patches.sh COMMITS the patched tree, so `git checkout -- .` is a
      # no-op: HEAD already contains the patches and the working tree is clean.
      # The next apply then hits "Reversed (or previously applied) patch
      # detected" and exits 1. Reset to the upstream branch instead.
      - name: Restore tree to pristine
        run: |
          if [ -d src/kernel/.git ]; then
            git -C src/kernel fetch --depth=1 origin lineage-21 || true
            git -C src/kernel reset --hard origin/lineage-21
            git -C src/kernel clean -fdq
            rm -f src/kernel/.nethunter-patches-applied
          fi
          # Fail here, not 6 minutes into the build, if the reset did not work.
          if [ -f src/kernel/net/mac80211/tx.c ] &&
             grep -q MONITOR_FLAG_COOK_FRAMES src/kernel/net/mac80211/tx.c; then
            echo "kernel tree still carries the NetHunter patches after reset" >&2
            exit 1
          fi

      - name: Build kernel
        run: |
          free -g
          # LTO links all ~4.5k objects in one lld invocation; the runner has 16 GB.
          # Observed peak is under that, but swap keeps a spike from OOM-killing it.
          sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile
          sudo mkswap /swapfile && sudo swapon /swapfile
          free -g
          # Short workspace path: KBUILD_NOCMDDEP is not enough on its own, the
          # absolute paths in the recorded command lines are the other half.
          ln -sfn "$GITHUB_WORKSPACE" /tmp/kws
          cd /tmp/kws
          ARGS="--jobs $(nproc)"
          [ "${{ inputs.lite }}" = "true" ] && ARGS="$ARGS --lite"
          # tee so the log survives a failure and can be uploaded below.
          set -o pipefail
          KBUILD_NOCMDDEP=1 ./scripts/build.sh $ARGS 2>&1 | tee /tmp/build.log

      # Runs even when the build failed, so the failing compiler output is
      # retrievable without admin access to the run logs.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore

      - name: Package AnyKernel3
        run: |
          curl -sL -o ak3.tar.gz https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.tar.gz
          tar xzf ak3.tar.gz
          cp configs/anykernel.sh AnyKernel3-master/anykernel.sh
          cp out/arch/arm64/boot/Image.gz AnyKernel3-master/
          cd AnyKernel3-master
          zip -r9 ../nethunter-miatoll-$(date +%Y%m%d)-${{ github.run_number }}.zip \
            anykernel.sh Image.gz META-INF tools patch

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-miatoll-kernel
          path: |
            nethunter-miatoll-*.zip
            out/arch/arm64/boot/Image.gz
            out/.config
          if-no-files-found: error
